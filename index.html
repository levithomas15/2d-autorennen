<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PIXEL DRIFT CITY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="screen" width="480" height="270"></canvas>

  <!-- Bedienelemente: Lenkrad, Pedale, Schalthebel -->
  <div id="controls">
    <div id="wheelBox">
      <canvas id="wheel" width="220" height="220"></canvas>
    </div>

    <div id="pedals">
      <button class="pedal" id="pClutch">KUPP</button>
      <button class="pedal" id="pBrake">BREMSE</button>
      <button class="pedal" id="pHand">HAND</button>
      <button class="pedal" id="pGas">GAS</button>
    </div>

    <div id="shifterWrap">
      <button class="shiftBtn" id="shiftUp">+</button>
      <div id="shifter">
        <div id="shiftKnob"><span id="gearReadout">1</span></div>
      </div>
      <button class="shiftBtn" id="shiftDown">&minus;</button>
    </div>
  </div>

  <!-- Menue: Start / Garage / Einstellungen / Hilfe -->
  <div id="menu">
    <div class="panel">
      <header>
        <div class="brand">PIXEL<span>DRIFT</span>CITY</div>
        <div id="menuCash">$ 0</div>
      </header>
      <nav id="menuTabs"></nav>
      <div id="menuBody"></div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
