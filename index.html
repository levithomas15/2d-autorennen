<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PIXEL DRIFT CITY - Top-Down Drift-Simulator</title>
<meta name="description" content="Top-Down-Drift-Simulator im GTA2-Pixel-Look: sechs Strecken, funf tunebare Autos, Lenkrad, Gangschaltung, Wetter und dynamische Beleuchtung. Lauft direkt im Browser.">
<meta name="theme-color" content="#12121c">
<meta property="og:type" content="website">
<meta property="og:title" content="PIXEL DRIFT CITY">
<meta property="og:description" content="Top-Down-Drift-Simulator im GTA2-Pixel-Look. Sechs Strecken, funf tunebare Autos, Lenkrad und Gangschaltung - direkt im Browser.">
<meta property="og:image" content="https://levithomas15.github.io/2d-autorennen/media/screenshot-stadt.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2312121c'/%3E%3Crect x='3' y='2' width='10' height='12' rx='2' fill='%23e03e3e'/%3E%3Crect x='3' y='2' width='10' height='2' rx='1' fill='%23ff8a6a'/%3E%3Crect x='4' y='5' width='8' height='3' fill='%232b3546'/%3E%3Crect x='4' y='10' width='8' height='2' fill='%232b3546'/%3E%3Crect x='4' y='13' width='2' height='2' fill='%23fff3ce'/%3E%3Crect x='10' y='13' width='2' height='2' fill='%23fff3ce'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="screen" width="480" height="270"></canvas>

  <!-- Bedienelemente: Lenkrad, Pedale, Schalthebel -->
  <div id="controls">
    <div id="wheelBox">
      <canvas id="wheel" width="220" height="220"></canvas>
    </div>

    <!-- Handbremshebel und Pedalerie in echter Anordnung: Kupplung, Bremse, Gas -->
    <div id="handbrakeBox">
      <canvas class="lever" id="pHand" width="132" height="200"></canvas>
    </div>

    <div id="pedals">
      <canvas id="pedalBox" width="460" height="300"></canvas>
    </div>

    <div id="shifterWrap">
      <button class="shiftBtn" id="shiftUp">+</button>
      <div id="shifter">
        <div id="shiftKnob"><span id="gearReadout">1</span></div>
      </div>
      <button class="shiftBtn" id="shiftDown">&minus;</button>
    </div>
  </div>

  <!-- Menue: Start / Garage / Einstellungen / Hilfe -->
  <div id="menu">
    <div class="panel">
      <header>
        <div class="brand">PIXEL<span>DRIFT</span>CITY</div>
        <div id="menuCash">$ 0</div>
      </header>
      <nav id="menuTabs"></nav>
      <div id="menuBody"></div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
